<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07040f">
  <title>Granizados · Haz tu pedido</title>
  <!-- Arranque suave: las animaciones esperan a que la página termine de cargar (js/pedidos.js) -->
  <script>document.documentElement.classList.add("booting");</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css?v=2">
  <style>
    /* =================================================================
       NEÓN URBANO — tema exclusivo del portal de pedidos
       (sobrescribe los tokens de common.css solo en esta página)
       ================================================================= */
    :root {
      --bg: #07040f;
      --bg-2: #120a24;
      --surface: #150c2a;
      --surface-2: #1d1238;
      --text: #ffffff;
      --muted: #a99bc9;
      --line: rgba(255, 255, 255, .12);

      --pink: #ff2e88;
      --cyan: #22e8ff;
      --lime: #c6ff3d;
      --yellow: #ffe14d;
      --violet: #8b5cff;
      --orange: #ff7a1a;

      --brand: var(--pink);
      --brand-dark: #e01470;
      --brand-soft: rgba(255, 46, 136, .14);
      --ok: var(--lime);
      --danger: #ff4d6d;
      --danger-soft: rgba(255, 77, 109, .14);
      --warn: var(--yellow);
      --warn-soft: rgba(255, 225, 77, .1);

      --glow-pink: 0 0 18px rgba(255, 46, 136, .55), 0 0 42px rgba(255, 46, 136, .25);
      --glow-cyan: 0 0 18px rgba(34, 232, 255, .5), 0 0 40px rgba(34, 232, 255, .2);
      --glow-lime: 0 0 18px rgba(198, 255, 61, .5), 0 0 40px rgba(198, 255, 61, .2);

      --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
      --street: "Permanent Marker", "Anton", cursive;
      --font: "Outfit", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --radius: 24px;
      --shadow: 0 10px 30px rgba(0, 0, 0, .45);
    }

    html { background: var(--bg); }
    body {
      font-family: var(--font);
      color: var(--text);
      background: transparent;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
      overflow-x: hidden;
    }
    /* Luces de fondo en una capa fija aparte (no se repinta al desplazar) */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background:
        radial-gradient(700px 500px at -10% -5%, rgba(255, 46, 136, .28), transparent 60%),
        radial-gradient(600px 520px at 110% 25%, rgba(34, 232, 255, .18), transparent 60%),
        radial-gradient(700px 600px at 30% 110%, rgba(139, 92, 255, .30), transparent 60%);
      will-change: transform;
    }
    /* Retícula urbana sutil */
    body::after {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      will-change: transform;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 85%);
    }
    body.no-scroll { overflow: hidden; }
    body.has-cartbar #app { padding-bottom: 110px; }
    ::selection { background: var(--pink); color: #fff; }

    /* ---------- Franja que se desplaza ---------- */
    .marquee {
      overflow: hidden; white-space: nowrap;
      background: var(--lime); color: #07040f;
      border-bottom: 2px solid #000;
      font-weight: 800; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase;
      padding: 7px 0;
    }
    .marquee-track { display: inline-flex; animation: marquee 22s linear infinite; }
    .marquee-track span { padding: 0 14px; }
    .marquee-track b { color: var(--pink); -webkit-text-stroke: .4px #000; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* ---------- Barra superior ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 10px;
      height: 64px; padding: 0 14px;
      background: rgba(7, 4, 15, .94);
      border-bottom: 1px solid var(--line);
    }
    .logo {
      width: 42px; height: 42px; flex: none; border-radius: 50%;
      display: grid; place-items: center; font-size: 1.3rem;
      background: var(--pink); border: 2px solid #000;
      box-shadow: 3px 3px 0 #000, var(--glow-pink);
      transform: rotate(-8deg);
    }
    .brand {
      flex: 1; font-family: var(--display); font-size: 1.55rem; letter-spacing: .02em;
      text-transform: uppercase; line-height: 1;
      color: #fff; text-shadow: 0 0 10px rgba(255, 46, 136, .7), 0 0 26px rgba(255, 46, 136, .4);
      animation: ledC 7s infinite;
    }
    .icon-btn {
      position: relative; width: 46px; height: 46px; border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06);
      color: #fff; font-size: 1.25rem; display: grid; place-items: center;
      transition: border-color .15s, box-shadow .15s;
    }
    .icon-btn:hover { border-color: var(--cyan); box-shadow: var(--glow-cyan); }
    .badge {
      position: absolute; top: -4px; right: -4px; min-width: 22px; height: 22px; padding: 0 6px;
      border-radius: 11px; background: var(--lime); color: #07040f; border: 2px solid #000;
      font-size: .75rem; font-weight: 800; display: grid; place-items: center;
      box-shadow: var(--glow-lime);
    }

    /* ---------- HERO ---------- */
    .hero {
      position: relative; isolation: isolate; overflow: hidden;
      width: 100%;
      padding: 34px 16px 30px; text-align: center;
    }
    /* Tubo de granizado: capa estática (se pinta una vez) + capa de luces en movimiento */
    .hero-tube-wrap {
      position: absolute; z-index: -1; left: -10%; top: 2%; width: 120%; height: 96%;
      pointer-events: none;
      animation: tubeFloat 7s ease-in-out infinite;
      will-change: transform;
    }
    .hero-tube, .hero-sparks {
      position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible;
      will-change: transform; /* cada una en su propia capa: las luces no repintan la textura */
    }
    .hero-sparks path { fill: none; stroke-linecap: round; }
    .spark-a { stroke-dasharray: 1 34; animation: flowA 2.6s linear infinite; }
    .spark-b { stroke-dasharray: 1 22; animation: flowB 3.8s linear infinite; }
    .spark-sweep { stroke-dasharray: 160 1360; animation: sweep 5s linear infinite; }
    @keyframes flowA { to { stroke-dashoffset: -350; } }
    @keyframes flowB { to { stroke-dashoffset: -230; } }
    @keyframes sweep { from { stroke-dashoffset: 1520; } to { stroke-dashoffset: 0; } }
    @keyframes tubeFloat {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -10px, 0); }
    }

    .hero-title {
      margin: 26px 0 0; font-family: var(--display); font-weight: 400;
      font-size: clamp(92px, 27vw, 240px); line-height: .8; letter-spacing: -.005em;
      text-transform: uppercase;
    }
    .hero-title span { display: block; }
    /* Letrero LED: cada palabra parpadea a su ritmo (solo opacidad → lo hace la GPU) */
    .hero-title .t1 {
      color: #fff;
      text-shadow: 0 0 6px #fff, 0 0 22px rgba(255, 46, 136, .9), 0 0 60px rgba(255, 46, 136, .55);
      animation: ledA 5s infinite;
    }
    .hero-title .t1 i { font-style: normal; display: inline-block; }
    .hero-title .t1 .buzz { animation: buzz 2.3s infinite; }
    .hero-title .t2 {
      color: transparent;
      -webkit-text-stroke: 3px var(--cyan);
      filter: drop-shadow(0 0 10px rgba(34, 232, 255, .8)) drop-shadow(0 0 28px rgba(34, 232, 255, .4));
      animation: ledB 6.2s infinite;
    }
    @keyframes ledA {
      0%, 6%, 8.5%, 10%, 52%, 53.5%, 55%, 100% { opacity: 1; }
      7%, 9%, 52.7%, 54.2% { opacity: .12; }
    }
    @keyframes ledB {
      0%, 18%, 19.5%, 21%, 23%, 70%, 74%, 100% { opacity: 1; }
      18.7%, 20.2%, 22% { opacity: .1; }
      71%, 73% { opacity: .45; }
    }
    @keyframes ledC {
      0%, 30%, 31%, 32.5%, 100% { opacity: 1; }
      30.5%, 32% { opacity: .2; }
    }
    @keyframes buzz {
      0%, 40%, 43%, 46%, 49%, 100% { opacity: 1; }
      41.5%, 44.5%, 47.5% { opacity: .08; }
    }
    .hero-tag {
      margin: 18px 0 0; font-size: clamp(1.35rem, 5.5vw, 2.2rem); font-weight: 700; letter-spacing: -.01em;
    }
    .hero-tag em {
      font-style: normal; color: var(--lime);
      text-shadow: 0 0 14px rgba(198, 255, 61, .7);
    }
    .hero-cta {
      margin-top: 20px; display: inline-flex; align-items: center; gap: 10px;
      min-height: 54px; padding: 0 26px; border-radius: 999px;
      border: 2px solid #000; background: var(--yellow); color: #07040f;
      font-weight: 800; font-size: .95rem; letter-spacing: .06em; text-transform: uppercase;
      box-shadow: 4px 4px 0 #000, 0 0 30px rgba(255, 225, 77, .45);
      transition: transform .1s, box-shadow .1s;
    }
    .hero-cta:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 #000, 0 0 30px rgba(255, 225, 77, .45); }

    /* Pegatinas flotantes */
    .sticker {
      position: absolute; z-index: 2; display: grid; place-items: center;
      width: clamp(52px, 14vw, 84px); height: clamp(52px, 14vw, 84px);
      border-radius: 22px; border: 2.5px solid #000;
      font-size: clamp(1.7rem, 7vw, 2.7rem);
      box-shadow: 4px 4px 0 #000;
      animation: float 5s ease-in-out infinite;
      will-change: transform;
      pointer-events: none;
    }
    .sticker.s1 { top: 70px; left: max(4%, calc(50% - 480px)); background: var(--pink); --r: -14deg; box-shadow: 4px 4px 0 #000, var(--glow-pink); }
    .sticker.s2 { top: 60px; right: max(5%, calc(50% - 470px)); background: var(--cyan); --r: 12deg; border-radius: 50%; animation-delay: -1.2s; box-shadow: 4px 4px 0 #000, var(--glow-cyan); }
    .sticker.s3 { top: 46%; right: max(2%, calc(50% - 520px)); background: var(--yellow); --r: -8deg; animation-delay: -2.4s; }
    .sticker.s4 { top: 52%; left: max(1%, calc(50% - 530px)); background: var(--lime); --r: 10deg; border-radius: 50%; animation-delay: -3.3s; box-shadow: 4px 4px 0 #000, var(--glow-lime); }
    .sticker.s5 { bottom: 40px; right: max(16%, calc(50% - 330px)); background: var(--violet); --r: 16deg; width: 48px; height: 48px; font-size: 1.5rem; border-radius: 14px; animation-delay: -.6s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(var(--r)); }
      50% { transform: translateY(-10px) rotate(calc(var(--r) * -0.6)); }
    }

    #app { max-width: 1100px; margin: 0 auto; padding: 8px 16px 28px; scroll-margin-top: 70px; }

    /* ---------- Categorías ---------- */
    .cats {
      position: sticky; top: 64px; z-index: 40;
      display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; margin: 0 -16px 6px;
      background: rgba(7, 4, 15, .94);
      scrollbar-width: none;
    }
    .cats::-webkit-scrollbar { display: none; }
    .cats button {
      flex: none; padding: 9px 18px; border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,.25); background: transparent; color: #fff;
      font-weight: 700; font-size: .82rem; letter-spacing: .06em; text-transform: uppercase;
    }
    .cats button:hover { border-color: var(--pink); box-shadow: var(--glow-pink); }

    .section-title {
      margin: 22px 2px 14px; font-family: var(--display); font-weight: 400;
      font-size: clamp(2.6rem, 11vw, 4.2rem); line-height: .85; text-transform: uppercase;
      color: transparent; -webkit-text-stroke: 1.5px var(--pink);
      filter: drop-shadow(0 0 8px rgba(255, 46, 136, .7));
    }
    /* Las secciones fuera de pantalla no se dibujan hasta acercarse (apertura más liviana) */
    .menu-section { content-visibility: auto; contain-intrinsic-size: auto 900px; }
    .menu-title {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      margin: 10px 2px 14px;
    }

    /* ---------- Tarjetas de producto ---------- */
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 18px; counter-reset: card; }
    @media (min-width: 600px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 960px) { .menu-grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      counter-increment: card;
      position: relative; display: flex; flex-direction: column; overflow: hidden;
      background: linear-gradient(180deg, var(--surface-2), var(--surface));
      border: 1.5px solid var(--line); border-radius: 28px;
      box-shadow: var(--shadow);
      transition: transform .2s ease, border-color .2s, box-shadow .2s;
    }
    .card:hover, .card:focus-within {
      border-color: rgba(255, 46, 136, .7);
      box-shadow: var(--shadow), var(--glow-pink);
      transform: translateY(-3px);
    }
    .card-media {
      position: relative; padding: 0; border: 0; background: var(--bg-2);
      aspect-ratio: 16 / 11; overflow: hidden;
    }
    .card-media img, .card-media .img-ph { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
    .card:hover .card-media img { transform: scale(1.05); }
    .card-media::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(to top, var(--surface-2) 0%, rgba(29, 18, 56, .75) 22%, transparent 55%);
    }
    .card-media::after {
      content: counter(card, decimal-leading-zero);
      position: absolute; top: 12px; left: 12px; z-index: 2;
      padding: 4px 10px; border-radius: 999px;
      background: #000; color: var(--lime); border: 1.5px solid var(--lime);
      font-family: var(--display); font-size: 1rem; letter-spacing: .05em;
      box-shadow: var(--glow-lime);
    }
    .img-ph {
      display: grid; place-items: center; font-size: 4rem;
      background: radial-gradient(circle at 30% 30%, rgba(255, 46, 136, .5), transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(34, 232, 255, .45), transparent 60%), var(--bg-2);
    }
    .card-body { position: relative; z-index: 2; margin-top: -34px; padding: 0 18px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .card-body h3 {
      margin: 0; font-family: var(--display); font-weight: 400;
      font-size: 2rem; line-height: .95; text-transform: uppercase; letter-spacing: .01em;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }
    .desc { margin: 0; color: var(--muted); font-size: .95rem; }
    .tops-link {
      align-self: flex-start; margin-top: 2px; padding: 5px 12px; border-radius: 999px;
      border: 1.5px dashed rgba(34, 232, 255, .6); background: rgba(34, 232, 255, .08);
      color: var(--cyan); font-weight: 700; font-size: .78rem; letter-spacing: .05em; text-transform: uppercase;
    }
    .card-foot { margin-top: auto; padding-top: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .size-hints { display: flex; flex-wrap: wrap; gap: 6px; }
    .size-hints span {
      padding: 4px 10px; border-radius: 999px; border: 1.5px solid rgba(198, 255, 61, .55);
      color: var(--lime); font-weight: 800; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase;
    }
    .card-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex: none; }
    .in-cart { font-size: .75rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--cyan); }

    /* Selector de tamaño (hoja del producto) */
    .size-block { margin-top: 14px; }
    .size-block h4 {
      margin: 0 0 10px; font-family: var(--display); font-weight: 400; font-size: 1.35rem;
      letter-spacing: .02em; text-transform: uppercase; color: var(--yellow);
      text-shadow: 0 0 10px rgba(255, 225, 77, .45);
    }
    .size-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
    .size-opt {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 12px 6px; border-radius: 20px; color: #fff;
      border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.03);
      transition: border-color .15s, box-shadow .15s, background .15s, transform .1s;
    }
    .size-opt:active { transform: scale(.97); }
    .size-opt.on { border-color: var(--lime); background: rgba(198, 255, 61, .1); box-shadow: var(--glow-lime); }
    .size-cup { height: 56px; display: flex; align-items: flex-end; justify-content: center; margin-bottom: 4px; }
    .size-cup svg { height: calc(56px * var(--cup, 1)); width: auto; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
    .size-name { font-family: var(--display); font-size: 1.5rem; line-height: 1.05; text-transform: uppercase; }
    .size-price { font-weight: 800; color: var(--lime); font-variant-numeric: tabular-nums; }
    .sheet-foot .btn:disabled { opacity: .55; }

    /* ---------- Botones (solo en esta página) ---------- */
    .btn {
      font-weight: 800; letter-spacing: .05em; text-transform: uppercase; font-size: .95rem;
      border: 2px solid #000;
      background: var(--pink); color: #fff;
      box-shadow: 3px 3px 0 #000, var(--glow-pink);
      transition: transform .1s, box-shadow .15s, background .15s;
    }
    .btn:hover:not(:disabled) { background: #ff4b9b; }
    .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000, var(--glow-pink); }
    .btn-ghost {
      background: rgba(255,255,255,.04); color: #fff;
      border: 1.5px solid rgba(255,255,255,.28); box-shadow: none;
    }
    .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,.08); border-color: var(--cyan); box-shadow: var(--glow-cyan); }
    .btn-ghost:active:not(:disabled) { box-shadow: none; }
    .btn-ok { background: var(--lime); color: #07040f; box-shadow: 3px 3px 0 #000, var(--glow-lime); }
    .btn-ok:hover:not(:disabled) { background: #d4ff6b; }
    .btn-ok:active:not(:disabled) { box-shadow: 1px 1px 0 #000, var(--glow-lime); }
    .btn-ok .spinner { border-color: rgba(0,0,0,.2); border-top-color: #07040f; }
    .btn-danger { background: var(--danger-soft); color: #ff8fa3; border: 1.5px solid rgba(255, 77, 109, .5); box-shadow: none; }
    .btn-danger:hover:not(:disabled) { background: rgba(255, 77, 109, .22); }
    .btn-danger:active:not(:disabled) { box-shadow: none; }
    .btn-lg { min-height: 60px; font-size: 1.05rem; }
    .add-btn { min-height: 46px; padding: 0 22px; }

    .stepper {
      display: inline-flex; align-items: center; padding: 4px;
      border-radius: 999px; background: #000; border: 1.5px solid rgba(255, 46, 136, .7);
      box-shadow: var(--glow-pink);
    }
    .stepper button {
      width: 40px; height: 40px; border-radius: 50%; border: 0;
      background: var(--pink); color: #fff; font-size: 1.4rem; font-weight: 800; line-height: 1;
    }
    .stepper button:first-child { background: rgba(255,255,255,.12); }
    .stepper span { min-width: 38px; text-align: center; font-family: var(--display); font-size: 1.4rem; }
    .stepper.big button { width: 46px; height: 46px; }

    /* ---------- Hoja del producto ---------- */
    .sheet-backdrop {
      position: fixed; inset: 0; z-index: 100; background: rgba(3, 1, 8, .7);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      opacity: 0; transition: opacity .2s;
    }
    .sheet-backdrop.open { opacity: 1; }
    .sheet-backdrop:not(.open) { pointer-events: none; }
    .sheet {
      position: relative; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh;
      background: var(--surface); border: 1.5px solid rgba(255, 46, 136, .5); border-bottom: 0;
      border-radius: 30px 30px 0 0; box-shadow: 0 -10px 60px rgba(255, 46, 136, .25);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(40px); transition: transform .22s ease;
    }
    .sheet-backdrop.open .sheet { transform: none; }
    @media (min-width: 600px) {
      .sheet-backdrop { align-items: center; }
      .sheet { border-radius: 30px; border-bottom: 1.5px solid rgba(255, 46, 136, .5); max-height: 88vh; }
    }
    .sheet-close {
      position: absolute; top: 12px; right: 12px; z-index: 3; width: 42px; height: 42px;
      border-radius: 50%; border: 2px solid #000; background: var(--yellow); color: #000;
      font-size: 1.6rem; font-weight: 800; line-height: 1; box-shadow: 3px 3px 0 #000;
    }
    .sheet-body { overflow-y: auto; overscroll-behavior: contain; }
    .sheet-media { position: relative; aspect-ratio: 16 / 9; background: var(--bg-2); }
    .sheet-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, var(--surface) 0%, transparent 50%); }
    .sheet-media img, .sheet-media .img-ph { width: 100%; height: 100%; object-fit: cover; }
    .sheet-info { position: relative; padding: 0 18px 18px; margin-top: -30px; }
    .sheet-info h2 {
      margin: 0 0 4px; font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: .95;
      text-transform: uppercase; text-shadow: 0 0 18px rgba(255, 46, 136, .6);
    }
    .sheet-base { margin-top: 8px; color: var(--muted); font-weight: 600; }
    .sheet-base b { color: var(--lime); font-size: 1.15rem; text-shadow: 0 0 10px rgba(198, 255, 61, .5); }
    .qty-row {
      display: flex; align-items: center; justify-content: space-between;
      margin: 16px 0 6px; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .9rem;
    }
    .tp-block {
      margin-top: 14px; padding: 14px; border-radius: 22px;
      background: rgba(255,255,255,.03); border: 1.5px solid var(--line);
    }
    .tp-block h4 {
      margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
      font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: .02em; text-transform: uppercase;
      color: var(--cyan); text-shadow: 0 0 10px rgba(34, 232, 255, .5);
    }
    .tp-block .max {
      font-family: var(--font); font-size: .72rem; font-weight: 800; letter-spacing: .04em;
      color: #07040f; background: var(--yellow); padding: 3px 9px; border-radius: 999px; text-shadow: none;
    }
    .tp-note { margin: -4px 0 10px; color: var(--muted); font-size: .88rem; }
    .tp-list { display: flex; flex-direction: column; gap: 8px; }
    .tp {
      display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 14px;
      border-radius: 16px; background: rgba(255,255,255,.04); border: 1.5px solid transparent;
      cursor: pointer; user-select: none; transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .tp input { position: absolute; opacity: 0; pointer-events: none; }
    .tp-box {
      flex: none; width: 26px; height: 26px; border-radius: 8px;
      border: 2px solid rgba(255,255,255,.35); background: transparent;
      display: grid; place-items: center;
    }
    .tp.on { background: rgba(255, 46, 136, .12); border-color: var(--pink); box-shadow: var(--glow-pink); }
    .tp.on .tp-box { background: var(--pink); border-color: var(--pink); }
    .tp.on .tp-box::after { content: "✓"; color: #fff; font-weight: 900; font-size: .95rem; }
    .tp.off { opacity: .35; cursor: not-allowed; }
    .tp input:focus-visible + .tp-box { outline: 3px solid var(--cyan); outline-offset: 2px; }
    .tp-img { width: 34px; height: 34px; border-radius: 10px; object-fit: cover; }
    .tp-name { flex: 1; font-weight: 600; }
    .tp-price { font-weight: 800; color: var(--lime); font-variant-numeric: tabular-nums; }
    .unit-sum { margin-top: 12px; font-size: .9rem; color: var(--muted); text-align: right; }
    .unit-sum b { color: #fff; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: .02em; }
    .sheet-foot {
      display: flex; gap: 10px; padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line); background: var(--surface);
    }

    /* ---------- Barra flotante del carrito ---------- */
    .cartbar {
      position: fixed; left: 12px; right: 12px; bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 60;
      max-width: 560px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      min-height: 66px; padding: 0 24px; border-radius: 999px;
      border: 2px solid #000;
      background: linear-gradient(100deg, var(--pink), var(--violet));
      color: #fff; font-weight: 800; font-size: 1.05rem; letter-spacing: .04em; text-transform: uppercase;
      box-shadow: 4px 4px 0 #000, 0 0 40px rgba(255, 46, 136, .55);
    }
    /* Pulso de brillo animando solo opacidad (lo hace la GPU, sin repintar) */
    .cartbar::after {
      content: ""; position: absolute; inset: -2px; border-radius: inherit; z-index: -1; pointer-events: none;
      box-shadow: 0 0 60px rgba(255, 46, 136, .8);
      opacity: 0; animation: pulse 2.6s ease-in-out infinite; will-change: opacity;
    }
    .cartbar small { display: block; font-weight: 600; opacity: .9; font-size: .74rem; text-align: left; letter-spacing: .06em; }
    #cartbarTotal { font-family: var(--display); font-weight: 400; font-size: 1.7rem; letter-spacing: .02em; }
    @keyframes pulse { 50% { opacity: 1; } }

    /* ---------- Páginas del proceso ---------- */
    .page { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 160px; }
    .page-title {
      margin: 10px 2px 2px; font-family: var(--display); font-weight: 400;
      font-size: clamp(2.8rem, 13vw, 4rem); line-height: .85; text-transform: uppercase;
      text-shadow: 0 0 8px #fff, 0 0 26px rgba(255, 46, 136, .7);
    }
    .panel {
      background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 18px;
    }
    .muted { color: var(--muted); font-size: .9rem; }
    .cl-head { display: flex; gap: 14px; align-items: center; margin-bottom: 8px; }
    .cl-thumb {
      width: 68px; height: 68px; flex: none; border-radius: 18px; object-fit: cover; font-size: 1.8rem;
      border: 2px solid var(--pink); box-shadow: var(--glow-pink);
    }
    .cl-title h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1; text-transform: uppercase; }
    .cl-actions { display: flex; gap: 8px; margin-top: 14px; }
    .cl-actions .btn { flex: 1; }

    /* Recibo */
    .rx-item { border-bottom-color: rgba(255,255,255,.1); }
    .rx-item-head { font-family: var(--display); font-weight: 400; font-size: 1.4rem; letter-spacing: .01em; text-transform: uppercase; }
    .rx-unit { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.07); border-radius: 14px; }
    .rx-unit-title { color: var(--cyan); }
    .rx-top { color: var(--muted); }
    .rx-unit-total { border-top-color: rgba(255,255,255,.1); }
    .rx-subtotal span:last-child { color: var(--lime); }

    .sticky-foot {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
      background: rgba(10, 6, 22, .97);
      border-top: 1.5px solid rgba(255, 46, 136, .45);
      box-shadow: 0 -10px 40px rgba(255, 46, 136, .15);
    }
    .sticky-foot > * { max-width: 528px; margin-left: auto; margin-right: auto; }
    .total-row {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px;
      font-weight: 800; letter-spacing: .06em; font-size: .85rem; color: var(--muted);
    }
    .total-row strong {
      font-family: var(--display); font-weight: 400; font-size: 2.1rem; letter-spacing: .02em;
      color: var(--lime); text-shadow: 0 0 14px rgba(198, 255, 61, .6);
    }

    .q-title {
      display: block; margin-bottom: 12px; font-family: var(--display); font-weight: 400;
      font-size: 2rem; line-height: .95; text-transform: uppercase;
    }
    .name-input {
      width: 100%; height: 62px; padding: 0 18px; border-radius: 18px;
      border: 2px solid rgba(255,255,255,.18); background: #000; color: #fff;
      font-family: var(--display); font-size: 1.7rem; letter-spacing: .03em; text-transform: uppercase;
      transition: border-color .15s, box-shadow .15s;
    }
    .name-input::placeholder { color: rgba(255,255,255,.28); }
    .name-input:focus { outline: none; border-color: var(--cyan); box-shadow: var(--glow-cyan); }
    .hint { margin: 10px 2px 0; color: var(--muted); font-size: .88rem; }
    .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pay-opt {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
      min-height: 112px; border-radius: 22px;
      border: 2px solid rgba(255,255,255,.15); background: rgba(255,255,255,.03); color: #fff;
      font-weight: 800; font-size: .9rem; letter-spacing: .08em;
      transition: border-color .15s, box-shadow .15s, background .15s, transform .1s;
    }
    .pay-opt:active { transform: scale(.97); }
    .pay-opt.on { border-color: var(--cyan); background: rgba(34, 232, 255, .1); color: var(--cyan); box-shadow: var(--glow-cyan); }
    .pay-icon { font-size: 2.1rem; }

    .kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 7px 0; }
    .kv span { color: var(--muted); font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    .kv strong { font-size: 1.15rem; text-align: right; }
    .kv.big strong {
      font-family: var(--display); font-weight: 400; font-size: 2.4rem; letter-spacing: .02em;
      color: var(--lime); text-shadow: 0 0 14px rgba(198, 255, 61, .6);
    }
    .kv-label { color: var(--cyan); font-weight: 800; font-size: .8rem; letter-spacing: .1em; }
    .upper { text-transform: uppercase; }
    .edit-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .edit-links .btn { flex: 1; font-size: .78rem; }

    /* ---------- Pedido realizado ---------- */
    .done { text-align: center; padding-top: 16px; padding-bottom: 50px; }
    .done-check {
      width: 96px; height: 96px; margin: 8px auto 0; border-radius: 50%;
      background: var(--lime); color: #07040f; border: 3px solid #000;
      font-size: 3.2rem; font-weight: 900; display: grid; place-items: center;
      box-shadow: 5px 5px 0 #000, 0 0 50px rgba(198, 255, 61, .7);
      animation: pop .45s cubic-bezier(.2, 1.6, .4, 1);
    }
    @keyframes pop { from { transform: scale(.3) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    .done-title {
      margin: 14px 0 4px; font-family: var(--display); font-weight: 400;
      font-size: clamp(3rem, 15vw, 4.6rem); line-height: .95; text-transform: uppercase;
      color: #fff; text-shadow: 0 0 8px #fff, 0 0 30px rgba(198, 255, 61, .9), 0 0 70px rgba(198, 255, 61, .5);
    }
    .done-card { text-align: left; border-color: rgba(198, 255, 61, .35); }
    .order-no {
      font-family: var(--display); font-weight: 400; font-size: 2.6rem !important; letter-spacing: .02em;
      color: var(--pink); text-shadow: 0 0 16px rgba(255, 46, 136, .8);
    }
    .notice {
      background: rgba(255, 225, 77, .07); border: 2px dashed var(--yellow);
      box-shadow: 0 0 30px rgba(255, 225, 77, .12);
    }
    .notice p { margin: 4px 0; }
    .notice-main { font-weight: 800; font-size: 1.15rem; color: var(--yellow); }
    .cashier-name {
      margin-top: 14px; padding: 16px; border-radius: 20px;
      background: #000; border: 2px solid var(--pink); box-shadow: var(--glow-pink);
    }
    .cashier-name span { display: block; color: var(--muted); font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    .cashier-name strong {
      display: block; margin-top: 4px; font-family: var(--display); font-weight: 400;
      font-size: clamp(2.6rem, 13vw, 3.6rem); line-height: .95; text-transform: uppercase; word-break: break-word;
      color: #fff; text-shadow: 0 0 8px #fff, 0 0 26px rgba(255, 46, 136, .9);
    }

    .empty { text-align: center; padding: 12vh 16px; }
    .empty-icon { font-size: 3.8rem; filter: drop-shadow(0 0 18px rgba(255, 46, 136, .6)); }
    .empty h2 { margin: 10px 0 6px; font-family: var(--display); font-weight: 400; font-size: 2.4rem; line-height: .95; text-transform: uppercase; }
    .empty p { color: var(--muted); margin: 0 0 22px; }

    /* ---------- Avisos y carga ---------- */
    .toast { opacity: 0; transition: transform .25s ease, opacity .25s ease; }
    .toast.show { opacity: 1; }
    .toast { background: #000; border: 1.5px solid var(--cyan); box-shadow: var(--glow-cyan); font-weight: 600; }
    .toast-ok { background: #000; border-color: var(--lime); box-shadow: var(--glow-lime); }
    .toast-error { background: #1a0510; border-color: var(--danger); box-shadow: 0 0 24px rgba(255, 77, 109, .45); }
    .toast button { color: var(--yellow); }
    .spinner.dark { border-color: rgba(255,255,255,.12); border-top-color: var(--pink); }
    .fatal code { background: rgba(255,255,255,.1); }

    /* ---------- PROMOCIONES (estilo callejero) ---------- */
    .promo-zone { margin-top: 12px; }
    .promo-head {
      margin: 10px 2px 20px; font-family: var(--street); font-weight: 400;
      font-size: clamp(2.3rem, 10vw, 3.6rem); line-height: 1; text-transform: uppercase;
      color: var(--yellow); text-shadow: 3px 3px 0 #000, 0 0 22px rgba(255, 225, 77, .5);
      transform: rotate(-2.5deg); transform-origin: left;
    }
    .promo-head-2 {
      display: inline-block; margin-left: 10px; padding: 2px 12px; vertical-align: middle;
      font-size: .55em; color: #fff; background: var(--pink); border: 2px solid #000;
      box-shadow: 4px 4px 0 #000; text-shadow: none; transform: rotate(5deg);
    }
    .promo-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 26px; }
    .promo {
      --pc: var(--pink); --ink: #fff; --glow: rgba(255, 46, 136, .5);
      position: relative; overflow: hidden; color: var(--ink);
      border: 3px solid #000; border-radius: 26px;
      background:
        radial-gradient(circle at 88% 18%, rgba(255,255,255,.4), transparent 32%),
        radial-gradient(circle at 8% 92%, rgba(0,0,0,.18), transparent 30%),
        repeating-linear-gradient(-45deg, rgba(0,0,0,.06) 0 10px, transparent 10px 22px),
        var(--pc);
      box-shadow: 6px 6px 0 #000, 0 0 46px var(--glow);
      transform: rotate(-.7deg);
    }
    .promo:nth-child(even) { transform: rotate(.7deg); }
    .promo-lima { --pc: var(--lime); --ink: #07040f; --glow: rgba(198, 255, 61, .4); }
    .promo-amarillo { --pc: var(--yellow); --ink: #07040f; --glow: rgba(255, 225, 77, .4); }
    .promo-cian { --pc: var(--cyan); --ink: #07040f; --glow: rgba(34, 232, 255, .4); }
    /* Cinta de precaución que se desplaza */
    .promo-tape {
      overflow: hidden; white-space: nowrap; margin: 10px -12px 0;
      background: #000; color: var(--yellow); border-block: 2px solid var(--yellow);
      font-weight: 900; font-size: .72rem; letter-spacing: .16em; padding: 5px 0;
      transform: rotate(-1.8deg);
    }
    .promo-tape.bottom { margin: 0 -12px 10px; transform: rotate(1.4deg); color: #fff; border-color: #fff; }
    .promo-tape span { display: inline-block; animation: marquee 14s linear infinite; will-change: transform; }
    .promo-tape.bottom span { animation-direction: reverse; }
    .promo-inner { display: flex; align-items: center; gap: 16px; padding: 16px 18px 18px; }
    .promo-img {
      flex: none; width: 38%; max-width: 220px; aspect-ratio: 1; overflow: hidden;
      border: 3px solid #000; border-radius: 20px; box-shadow: 4px 4px 0 #000; transform: rotate(3deg);
    }
    .promo-img img { width: 100%; height: 100%; object-fit: cover; }
    .promo-text { flex: 1; min-width: 0; }
    .promo-sticker {
      display: inline-block; padding: 4px 12px; border-radius: 999px;
      background: #000; color: var(--yellow); font-weight: 800; font-size: .74rem;
      letter-spacing: .08em; text-transform: uppercase; transform: rotate(-3deg);
      animation: wiggle 1.8s ease-in-out infinite;
    }
    @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.05); } }
    .promo-badge {
      margin: 8px 0 2px; font-family: var(--display); font-weight: 400; word-break: break-word;
      font-size: clamp(3.6rem, 19vw, 6.6rem); line-height: .85; text-transform: uppercase;
      color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #000;
      transform: rotate(-4deg); transform-origin: left;
      animation: promoPulse 1.6s ease-in-out infinite;
    }
    @keyframes promoPulse { 0%, 100% { transform: rotate(-4deg) scale(1); } 50% { transform: rotate(-4deg) scale(1.06); } }
    .promo-title { margin: 8px 0 4px; font-family: var(--street); font-weight: 400; font-size: clamp(1.45rem, 6vw, 2.1rem); line-height: 1.05; }
    .promo-desc { margin: 0; font-weight: 600; font-size: .98rem; }
    .promo-cta {
      margin-top: 14px; min-height: 50px; padding: 0 22px; border-radius: 999px;
      border: 2.5px solid #000; background: #000; color: var(--yellow);
      font-weight: 900; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(0,0,0,.35); transition: transform .1s;
    }
    .promo-cta:active { transform: translate(2px, 2px); }
    @media (max-width: 459px) {
      .promo-inner { flex-direction: column; align-items: stretch; }
      .promo-img { width: 100%; max-width: none; aspect-ratio: 16 / 9; transform: rotate(-1.5deg); }
    }

    /* ---------- MIX de sabores ---------- */
    .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
    .mix-link { border-color: rgba(139, 92, 255, .85); background: rgba(139, 92, 255, .14); color: #cbb9ff; }
    .unit-h { margin-bottom: 10px; font-family: var(--display); font-size: 1.55rem; line-height: 1; text-transform: uppercase; }
    .mix-box {
      margin-bottom: 14px; padding: 12px; border-radius: 18px;
      border: 1.5px dashed rgba(139, 92, 255, .65); background: rgba(139, 92, 255, .08);
      transition: border-color .15s, box-shadow .15s;
    }
    .mix-box.on { border-style: solid; border-color: var(--violet); box-shadow: 0 0 24px rgba(139, 92, 255, .45); }
    .mix-toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
    .mix-toggle input { position: absolute; opacity: 0; pointer-events: none; }
    .mix-switch {
      position: relative; flex: none; width: 54px; height: 32px; border-radius: 16px;
      background: rgba(255,255,255,.18); border: 2px solid #000; transition: background .15s;
    }
    .mix-switch::after {
      content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%;
      background: #fff; transition: transform .15s;
    }
    .mix-toggle input:checked + .mix-switch { background: var(--violet); box-shadow: 0 0 14px rgba(139, 92, 255, .7); }
    .mix-toggle input:checked + .mix-switch::after { transform: translateX(22px); }
    .mix-toggle input:focus-visible + .mix-switch { outline: 3px solid var(--cyan); outline-offset: 2px; }
    .mix-label b { display: block; font-family: var(--display); font-weight: 400; font-size: 1.35rem; letter-spacing: .02em; text-transform: uppercase; color: #cbb9ff; }
    .mix-label small { color: var(--muted); font-size: .84rem; }
    .mix-note { margin: 10px 0 0; color: var(--lime); font-weight: 700; font-size: .9rem; }
    .rx-mix { color: #cbb9ff; }

    /* ---------- ACOMPAÑANTES ---------- */
    .sides-zone { margin-top: 34px; }
    .section-title.sides-title { -webkit-text-stroke-color: var(--yellow); filter: drop-shadow(0 0 8px rgba(255, 225, 77, .6)); }
    .sides-sub { margin: -6px 2px 14px; color: var(--muted); font-weight: 600; }
    .side-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 600px) { .side-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (min-width: 960px) { .side-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .side-card {
      display: flex; flex-direction: column; overflow: hidden; border-radius: 22px;
      background: var(--surface); border: 1.5px dashed rgba(255, 225, 77, .5);
    }
    .side-media { aspect-ratio: 4 / 3; background: var(--bg-2); }
    .side-media img, .side-media .img-ph { width: 100%; height: 100%; object-fit: cover; }
    .side-ph {
      font-size: 2.6rem;
      background: radial-gradient(circle at 30% 30%, rgba(255, 225, 77, .5), transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(255, 122, 26, .45), transparent 60%), var(--bg-2);
    }
    .side-body { flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; }
    .side-body h3 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.3rem; line-height: 1; text-transform: uppercase; }
    .side-body .desc { font-size: .82rem; }
    .side-foot { margin-top: auto; padding-top: 6px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .side-price { font-family: var(--display); font-size: 1.3rem; color: var(--yellow); text-shadow: 0 0 10px rgba(255, 225, 77, .4); }
    .btn.btn-side { min-height: 40px; padding: 0 14px; font-size: .8rem; background: var(--yellow); color: #07040f; box-shadow: 3px 3px 0 #000; }
    .btn.btn-side:hover:not(:disabled) { background: #ffe97a; }
    .side-ctrl .stepper { padding: 3px; }
    .side-ctrl .stepper button { width: 34px; height: 34px; font-size: 1.2rem; }
    .side-ctrl .stepper span { min-width: 28px; font-size: 1.2rem; }

    /* ---------- EXTRAS (cada categoría es su sección: "Cocteles", "Bebidas"…) ---------- */
    .section-title.extras-title { -webkit-text-stroke-color: var(--cyan); filter: drop-shadow(0 0 8px rgba(34, 232, 255, .6)); }
    .side-card.extra-card { border-color: rgba(34, 232, 255, .5); }
    .extra-card .side-price { color: var(--cyan); text-shadow: 0 0 10px rgba(34, 232, 255, .4); }
    .btn.btn-side.btn-extra { background: var(--cyan); }
    .btn.btn-side.btn-extra:hover:not(:disabled) { background: #7ff2ff; }
    .extra-ph {
      font-size: 2.6rem;
      background: radial-gradient(circle at 30% 30%, rgba(34, 232, 255, .5), transparent 60%),
                  radial-gradient(circle at 70% 70%, rgba(139, 92, 255, .45), transparent 60%), var(--bg-2);
    }

    /* ---------- AGOTADO: cinta de "precaución" callejera sobre la foto ---------- */
    .side-media { position: relative; overflow: hidden; }
    .card.soldout .card-media img, .card.soldout .card-media .img-ph,
    .side-card.soldout .side-media img, .side-card.soldout .side-media .img-ph { filter: grayscale(1) brightness(.5); }
    .card.soldout:hover, .card.soldout:focus-within { transform: none; border-color: var(--line); box-shadow: var(--shadow); }
    .card.soldout:hover .card-media img { transform: none; }
    .card.soldout h3, .side-card.soldout h3 { opacity: .7; }
    .card.soldout .size-hints span { border-color: var(--line); color: var(--muted); }
    .soldout-tape {
      position: absolute; z-index: 3; left: -12%; right: -12%; top: 50%;
      transform: translateY(-50%) rotate(-8deg); pointer-events: none;
      padding: 6px 0; border-block: 3px solid #000;
      background: repeating-linear-gradient(-45deg, var(--yellow) 0 16px, #000 16px 32px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, .65);
    }
    .soldout-tape span {
      display: block; width: max-content; margin: 0 auto; padding: 2px 18px;
      background: #000; color: var(--yellow); border: 2px solid var(--yellow);
      font-family: var(--display); font-size: 2.1rem; line-height: 1.1;
      letter-spacing: .1em; text-transform: uppercase;
      text-shadow: 0 0 10px rgba(255, 225, 77, .55);
    }
    .side-card .soldout-tape { padding: 4px 0; }
    .side-card .soldout-tape span { font-size: 1.25rem; padding: 1px 10px; }
    .soldout-note {
      font-family: var(--street); font-size: 1.05rem; color: var(--danger);
      transform: rotate(-3deg); white-space: nowrap;
    }

    .cs-line { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .kv-label + .cs-line { border-top: 0; }
    .cs-thumb { width: 54px; height: 54px; flex: none; border-radius: 14px; object-fit: cover; font-size: 1.5rem; }
    .cs-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .cs-info b { text-transform: uppercase; }
    .cart-sides .stepper button { width: 36px; height: 36px; font-size: 1.2rem; }
    .cart-sides .stepper span { min-width: 30px; font-size: 1.2rem; }
    .upsell { padding: 14px; border-radius: 22px; border: 2px dashed var(--yellow); background: rgba(255, 225, 77, .06); }
    .upsell-h { margin-bottom: 10px; font-family: var(--street); font-size: 1.3rem; color: var(--yellow); }
    .upsell-list { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .upsell-list::-webkit-scrollbar { display: none; }
    .upsell-item {
      flex: none; width: 132px; display: flex; flex-direction: column; gap: 4px; padding: 8px;
      border-radius: 16px; border: 1.5px solid var(--line); background: rgba(255,255,255,.04); color: #fff; text-align: left;
    }
    .upsell-item:hover { border-color: var(--yellow); }
    .upsell-img { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; object-fit: cover; font-size: 2rem; }
    .upsell-name { font-weight: 700; font-size: .88rem; line-height: 1.15; }
    .upsell-price { font-weight: 800; font-size: .85rem; color: var(--lime); }

    /* ---------- Cuenta regresiva del pedido realizado ---------- */
    .countdown {
      text-align: left; padding: 16px; border-radius: 22px; border: 2.5px solid #000;
      background: var(--yellow); color: #07040f; box-shadow: 5px 5px 0 #000, 0 0 30px rgba(255, 225, 77, .35);
      transition: background .3s, color .3s;
    }
    .cd-top { display: flex; align-items: center; gap: 12px; }
    .cd-icon { font-size: 2.2rem; animation: wiggle 1s ease-in-out infinite; }
    .cd-text { font-weight: 800; font-size: .92rem; letter-spacing: .03em; text-transform: uppercase; line-height: 1.2; }
    .cd-text b { display: block; font-family: var(--display); font-weight: 400; font-size: 2.8rem; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
    .cd-bar { height: 12px; margin: 10px 0; overflow: hidden; border-radius: 6px; border: 2px solid #000; background: rgba(0,0,0,.15); }
    .cd-bar span { display: block; height: 100%; background: var(--pink); transition: width .5s linear; }
    .cd-why, .cd-shot { margin: 4px 0; font-size: .92rem; font-weight: 600; }
    .countdown.urgent { background: var(--pink); color: #fff; }
    .countdown.urgent .cd-bar span { background: #fff; }
    .shot-zone {
      position: relative; display: flex; flex-direction: column; gap: 14px;
      margin-top: 8px; padding: 24px 12px 12px; border-radius: 26px; border: 2.5px dashed var(--lime);
    }
    .shot-label {
      position: absolute; top: -15px; left: 50%; transform: translateX(-50%) rotate(-2deg);
      padding: 3px 14px; border-radius: 999px; border: 2px solid #000; background: var(--lime); color: #07040f;
      font-weight: 900; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
    }

    /* Mientras la página carga, todo quieto (evita tirones al abrir) */
    .booting *, .booting *::before, .booting *::after { animation-play-state: paused !important; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>

  <section class="hero" id="hero">
    <!-- Tubo de granizado: capa estática con la textura (se pinta una sola vez) + capa de luces en movimiento -->
    <div class="hero-tube-wrap" aria-hidden="true">
      <svg class="hero-tube" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
        <defs>
          <path id="slushPath" d="M-60,400 C140,60 330,470 520,250 S820,30 1060,170" fill="none" stroke-linecap="round"/>
          <!-- Capas de sabor: amarillo → naranja → fucsia (como el granizado de la foto) -->
          <linearGradient id="slushColor" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
            <stop offset="0" stop-color="#ffe94f"/>
            <stop offset=".22" stop-color="#ffd615"/>
            <stop offset=".38" stop-color="#ff9a1f"/>
            <stop offset=".52" stop-color="#ff2d73"/>
            <stop offset=".68" stop-color="#e8125f"/>
            <stop offset=".84" stop-color="#ff7a2a"/>
            <stop offset="1" stop-color="#ffd615"/>
          </linearGradient>
          <!-- Textura de hielo raspado: imagen pequeña generada una vez al cargar (js/pedidos.js) -->
          <pattern id="iceTex" patternUnits="userSpaceOnUse" width="110" height="110">
            <image id="iceTexImg" x="0" y="0" width="110" height="110" preserveAspectRatio="none"/>
          </pattern>
          <filter id="slushBlur" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
          <filter id="softBlur" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
        </defs>
        <use href="#slushPath" stroke="url(#slushColor)" stroke-width="96" filter="url(#slushBlur)" opacity=".55"/>
        <use href="#slushPath" stroke="rgba(60,0,30,.55)" stroke-width="74"/>
        <use href="#slushPath" stroke="url(#slushColor)" stroke-width="64"/>
        <use href="#slushPath" stroke="url(#iceTex)" stroke-width="64"/>
        <use href="#slushPath" stroke="#fff" stroke-width="16" opacity=".35" transform="translate(0,-16)" filter="url(#softBlur)"/>
      </svg>
      <!-- Luces que fluyen por el tubo -->
      <svg class="hero-sparks" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid slice">
        <path class="spark-sweep" d="M-60,400 C140,60 330,470 520,250 S820,30 1060,170" stroke="rgba(255,255,255,.22)" stroke-width="54"/>
        <path class="spark-a" d="M-60,400 C140,60 330,470 520,250 S820,30 1060,170" stroke="rgba(255,255,255,.9)" stroke-width="6"/>
        <path class="spark-b" d="M-60,400 C140,60 330,470 520,250 S820,30 1060,170" stroke="rgba(255,255,255,.55)" stroke-width="3.5" transform="translate(0,-15)"/>
      </svg>
    </div>

    <h1 class="hero-title" aria-label="Granizados"><span class="t1" aria-hidden="true"><i>G</i><i>r</i><i>a</i><i class="buzz">n</i><i>i</i></span><span class="t2" aria-hidden="true">zados</span></h1>
    <p class="hero-tag">Frío. Dulce. <em>Tuyo.</em></p>
    <button class="hero-cta" id="heroCta" type="button">Ver granizados ↓</button>
