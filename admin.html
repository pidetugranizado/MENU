<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1d29">
  <title>Granizados · Personal</title>
  <link rel="stylesheet" href="css/common.css?v=2">
  <style>
    body.no-scroll { overflow: hidden; }

    /* ---------- Estructura ---------- */
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .side {
      position: sticky; top: 0; height: 100vh;
      background: #1b1d29; color: #fff; padding: 18px 12px; display: flex; flex-direction: column; gap: 4px;
    }
    .side-brand { font-weight: 800; font-size: 1.2rem; padding: 4px 10px 18px; }
    .side-brand small { display: block; font-weight: 500; font-size: .78rem; opacity: .6; }
    .nav-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 12px; border: 0; border-radius: 12px; background: transparent; color: #c9cbd6;
      font-weight: 600; font-size: .98rem; text-align: left;
    }
    .nav-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
    .nav-btn.active { background: var(--brand); color: #fff; }
    .nav-btn .ico { width: 22px; text-align: center; }
    .nav-badge { margin-left: auto; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: #ffd166; color: #1b1d29; font-size: .8rem; font-weight: 800; display: grid; place-items: center; }
    .side-foot { margin-top: auto; padding: 10px; font-size: .82rem; color: #9a9db0; word-break: break-all; }
    .side-foot .who b { display: block; color: #fff; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .side-foot .who small { display: block; color: #ffd166; font-weight: 700; font-size: .75rem; }
    .side-foot button { margin-top: 8px; background: rgba(255,255,255,.08); color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; width: 100%; }
    .main { padding: 20px 24px 60px; min-width: 0; }
    .global-error { background: var(--danger-soft); color: var(--danger); border-radius: 12px; padding: 12px 16px; font-weight: 600; margin-bottom: 14px; }

    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; }
      .side {
        position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 80;
        flex-direction: row; padding: 6px; gap: 2px; box-shadow: 0 -4px 20px rgba(0,0,0,.2);
        overflow-x: auto; scrollbar-width: none;
      }
      .side::-webkit-scrollbar { display: none; }
      .side-brand, .side-foot .who { display: none; }
      .nav-btn { flex: 1 0 68px; flex-direction: column; gap: 2px; padding: 8px 2px; font-size: .7rem; text-align: center; position: relative; }
      .nav-btn .ico { font-size: 1.25rem; width: auto; }
      .nav-badge { position: absolute; top: 2px; right: 50%; transform: translateX(22px); margin: 0; height: 20px; min-width: 20px; font-size: .7rem; }
      .side-foot { margin: 0; padding: 0; display: flex; flex: none; }
      .side-foot button { margin: 0; width: auto; padding: 0 10px; font-size: .7rem; white-space: nowrap; }
      .main { padding: 14px 16px 100px; }
    }

    /* ---------- Barras de herramientas ---------- */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 10px; }
    .view-title { margin: 0; flex: 1; font-size: 1.4rem; }
    .view-title small { color: var(--muted); font-weight: 500; font-size: 1rem; }
    .subtle { color: var(--muted); font-size: .88rem; margin: 4px 2px 14px; }
    .search-wrap { position: relative; flex: 1 1 360px; }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; }
    .search {
      width: 100%; height: 56px; padding: 0 16px 0 48px; border-radius: 14px;
      border: 2px solid var(--line); background: var(--surface); font-size: 1.15rem; font-weight: 500;
    }
    .search:focus { outline: none; border-color: var(--brand); }
    .chips { display: flex; gap: 6px; }
    .chips button { padding: 10px 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; }
    .chips button.active { background: var(--text); border-color: var(--text); color: #fff; }

    /* ---------- Tarjetas de pedido ---------- */
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
    .order { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; border-top: 5px solid var(--warn); }
    .order.is-paid { border-top-color: var(--ok); }
    .flash { animation: flash 1.6s ease 2; }
    @keyframes flash { 0%, 100% { box-shadow: var(--shadow); } 50% { box-shadow: 0 0 0 4px #ffd166, var(--shadow-lg); } }
    .o-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .o-no { font-weight: 800; font-size: 1.2rem; }
    .o-time { color: var(--muted); font-size: .88rem; }
    .pay-badge { padding: 5px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .pay-badge.efectivo { background: var(--ok-soft); color: #0e7d45; }
    .pay-badge.transferencia { background: var(--ice-soft); color: #08758b; }
    .o-client { margin: 10px 0 4px; }
    .o-client span, .t-client span { display: block; color: var(--muted); font-size: .75rem; font-weight: 700; letter-spacing: .06em; }
    .o-client strong { font-size: 1.5rem; text-transform: uppercase; line-height: 1.15; word-break: break-word; }
    .o-items { border-top: 1px solid var(--line); margin-top: 8px; }
    .o-total { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-top: 2px solid var(--text); margin-top: 4px; font-weight: 700; }
    .o-total strong { font-size: 1.5rem; }
    .o-pay { border-radius: 12px; padding: 12px; }
    .o-pay.pending { background: var(--warn-soft); }
    .o-pay.paid { background: var(--ok-soft); }
    .o-pay-row { display: flex; justify-content: space-between; font-size: .95rem; padding: 2px 0; }
    .o-pay-row span { color: var(--muted); font-weight: 600; }
    .o-pay-status { font-weight: 700; margin: 4px 0 10px; }
    .o-pay.paid .o-pay-status { color: #0e7d45; margin-bottom: 6px; }
    .o-pay-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
    .o-pay-actions .btn { padding-left: 8px; padding-right: 8px; }
    .o-pay-note { font-size: .85rem; color: var(--warn); font-weight: 600; margin-bottom: 4px; }
    .o-prep { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,0,0,.08); font-weight: 600; color: var(--warn); }
    .o-prep.done { color: #0e7d45; }

    .empty-box { background: var(--surface); border-radius: var(--radius); padding: 40px 20px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
    .empty-box.big { font-size: 1.2rem; padding: 70px 20px; }
    .empty-box small { font-size: .9rem; }

    /* ---------- Preparación ---------- */
    .tickets { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; align-items: start; }
    .ticket { background: #fffdf5; border: 2px solid #1b1d29; border-radius: var(--radius); padding: 16px; }
    .t-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 2px dashed #1b1d29; padding-bottom: 8px; }
    .t-no { font-size: 1.35rem; font-weight: 800; }
    .t-time { color: var(--muted); font-size: .88rem; }
    .t-client { margin: 10px 0; }
    .t-client strong { font-size: 1.8rem; text-transform: uppercase; line-height: 1.1; word-break: break-word; }
    .t-prod { border-top: 1px solid #d9d6c6; padding-top: 10px; margin-top: 10px; }
    .t-prod h3 { margin: 0 0 8px; font-size: 1.2rem; text-transform: uppercase; }
    .t-prod h3 span { background: var(--brand); color: #fff; border-radius: 8px; padding: 1px 8px; font-size: 1rem; margin-left: 6px; }
    .t-unit { background: #fff; border: 1.5px solid #e5e1cf; border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; font-size: 1.05rem; }
    .t-unit-h { font-weight: 800; color: var(--brand); text-transform: uppercase; font-size: .9rem; letter-spacing: .04em; }
    .t-tops-h { margin-top: 4px; }
    .t-unit ul { margin: 2px 0 0; padding-left: 22px; }
    .t-unit li { font-weight: 700; font-size: 1.1rem; }
    .t-none { margin-top: 4px; font-style: italic; color: var(--muted); }
    .ticket .btn { margin-top: 8px; }
    .t-mix { margin-top: 4px; padding: 4px 8px; border-radius: 8px; background: #efe9ff; color: #5b3fc4; font-size: 1rem; }
    /* Acompañantes: recuadro aparte para no confundirlos con los granizados */
    .t-sides { margin-top: 14px; padding: 10px 12px; border: 2px dashed #d97a06; border-radius: 12px; background: #fff6e5; }
    .t-sides h3 { margin: 0 0 6px; font-size: 1.05rem; text-transform: uppercase; color: #a35a00; }
    .t-sides h3 small { font-weight: 600; font-size: .78rem; text-transform: none; color: var(--muted); }
    .t-sides ul { margin: 0; padding-left: 0; list-style: none; }
    .t-sides li { font-weight: 700; font-size: 1.1rem; padding: 2px 0; }
    .t-sides li span { display: inline-block; min-width: 38px; color: #a35a00; }

    /* ---------- Promos (admin) ---------- */
    .promo-thumb { background: var(--pc) !important; border: 2px solid #1b1d29; }
    .promo-thumb b { font-size: 1.3rem; font-weight: 900; color: #fff; -webkit-text-stroke: 1px #1b1d29; text-align: center; line-height: 1; padding: 4px; word-break: break-word; }
    .promo-chip { display: inline-block; padding: 1px 8px; border-radius: 6px; background: #1b1d29; color: #ffe14d; font-weight: 900; font-size: .85rem; }
    .color-pick { align-items: center; }
    .color-pick input { margin: 0; }
    .swatch { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #1b1d29; flex: none; }

    /* ---------- Parqueadero (admin) ---------- */
    .pk-top { display: grid; grid-template-columns: minmax(260px, 340px) 1fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .pk-top { grid-template-columns: 1fr; } }
    .pk-rate { display: flex; flex-direction: column; gap: 10px; }
    .pk-rate .money-input input { font-size: 1.5rem !important; }
    .pk-kpis { margin: 0; }
    .pk-hist-form { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 12px; }
    @media (max-width: 760px) { .pk-hist-form { grid-template-columns: 1fr 1fr; } .pk-hist-form .field:first-child { grid-column: 1 / -1; } }
    .pk-table { min-width: 720px; }
    .pk-table tbody tr { cursor: default; }
    .pk-table tfoot td { padding: 12px 14px; border-top: 2px solid var(--text); }
    .pk-row-pend { background: #fff8f7; }
    .pk-name { text-transform: uppercase; font-weight: 600; }
    .pk-act { text-align: right; white-space: nowrap; }
    .pk-sub { color: var(--muted); font-size: .78rem; margin-top: 2px; }
    .pk-h { margin: 18px 2px 8px; font-size: 1rem; }
    .plate {
      display: inline-block; padding: 3px 10px; border-radius: 6px; border: 2px solid #1b1d29;
      background: #ffd400; color: #1b1d29; font-weight: 800; letter-spacing: .08em; font-family: ui-monospace, Consolas, monospace;
    }
    .pk-status { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: .76rem; font-weight: 800; white-space: nowrap; }
    .pk-status.pend { background: var(--danger-soft); color: var(--danger); }
    .pk-status.ok { background: var(--ok-soft); color: #0e7d45; }
    .pk-status.out { background: #eceef4; color: var(--muted); }

    /* ---------- Historial ---------- */
    .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
    .hist-form { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr 1fr auto; gap: 12px; align-items: end; margin-bottom: 12px; }
    @media (max-width: 1100px) { .hist-form { grid-template-columns: 1fr 1fr; } .hist-form .field:first-child { grid-column: 1 / -1; } }
    .hist-list { display: flex; flex-direction: column; gap: 8px; }
    .hist-row { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
    .hist-row summary {
      display: grid; grid-template-columns: 80px 140px 1fr 120px 150px 110px; gap: 10px; align-items: center;
      padding: 12px 16px; cursor: pointer; list-style: none;
    }
    .hist-row summary::-webkit-details-marker { display: none; }
    .hist-row[open] summary { border-bottom: 1px solid var(--line); }
    .hist-row .order { box-shadow: none; border-radius: 0 0 12px 12px; }
    .h-no { font-weight: 800; }
    .h-date { color: var(--muted); font-size: .88rem; }
    .h-name { font-weight: 700; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .h-total { font-weight: 700; text-align: right; }
    .h-status { font-size: .8rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; justify-self: start; }
    .h-status.ok { background: var(--ok-soft); color: #0e7d45; }
    .h-status.pend { background: var(--warn-soft); color: var(--warn); }
    @media (max-width: 760px) {
      .hist-row summary { grid-template-columns: auto 1fr auto; }
      .h-date, .h-pay { display: none; }
      .h-status { grid-column: 2; grid-row: 2; }
    }

    /* ---------- Catálogo (productos / toppings) ---------- */
    .cat-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
    .cat-item { display: flex; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; }
    .cat-item.inactive { opacity: .6; }
    .ci-img { width: 84px; height: 84px; flex: none; border-radius: 12px; overflow: hidden; background: var(--ice-soft); display: grid; place-items: center; font-size: 2rem; }
    .cat-item.small .ci-img { width: 56px; height: 56px; font-size: 1.5rem; }
    .ci-img img { width: 100%; height: 100%; object-fit: cover; }
    .ci-main { flex: 1; min-width: 0; }
    .ci-name { font-weight: 700; font-size: 1.05rem; }
    .ci-meta { color: var(--muted); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .ci-price { font-weight: 800; font-size: 1.1rem; margin-top: 2px; }
    .ci-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .ci-sizes { display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 4px 0 2px; }
    .ci-sizes span { background: var(--bg); border-radius: 8px; padding: 2px 8px; font-size: .88rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .ci-sizes b { color: var(--brand); }
    .ci-sizes + div .cost-tag { margin-left: 0; }

    /* ---------- Tamaños del producto ---------- */
    .size-head, .size-row { display: grid; grid-template-columns: minmax(120px, 1fr) minmax(150px, 1fr) 34px; gap: 8px; align-items: center; }
    .size-head { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 4px 8px; }
    .size-row { padding: 8px; border-radius: 12px; border: 1.5px solid transparent; margin-bottom: 6px; background: var(--bg); }
    .size-row.current { border-color: var(--brand); background: #fff; }
    .size-row input[data-s="name"] { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-size: 1rem; font-weight: 700; }
    .size-row input:focus { outline: none; border-color: var(--brand); }
    .size-row .money-input input { min-height: 42px; width: 100%; }
    .size-note { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; padding-left: 2px; }
    .size-note .neg { color: var(--danger); }
    .size-tabs { flex-wrap: wrap; margin: 2px 0 6px; }
    .copy-recipe { margin-bottom: 8px; }
    .copy-recipe select { min-height: 38px; padding: 6px 10px; border-radius: 8px; border: 1.5px dashed var(--brand); background: #fff; font-weight: 600; color: var(--brand); }
    .size-tag { display: inline-block; padding: 1px 7px; border-radius: 999px; background: var(--ice-soft); color: #08758b; font-weight: 700; font-size: .78em; vertical-align: middle; }
    .t-size { font-style: normal; background: #1b1d29; color: #fff; border-radius: 8px; padding: 1px 8px; font-size: 1rem; }

    .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
    .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .switch span { width: 44px; height: 26px; border-radius: 13px; background: #c9ccd8; position: relative; transition: background .15s; flex: none; }
    .switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
    .switch input:checked + span { background: var(--ok); }
    .switch input:checked + span::after { transform: translateX(18px); }
    .switch input:focus-visible + span { outline: 3px solid var(--ice); outline-offset: 2px; }
    .switch em { font-style: normal; font-size: .82rem; font-weight: 600; color: var(--muted); }
    .switch.big em { font-size: .95rem; color: var(--text); }

    /* ---------- Formularios ---------- */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field > span, .field-label { font-size: .82rem; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
    .field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea, .img-actions input[type=url] {
      width: 100%; min-height: 46px; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-size: 1rem;
    }
    .field textarea { resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus, .img-actions input:focus { outline: none; border-color: var(--brand); }
    .field.inline { margin-top: 10px; }
    .field.inline input { max-width: 120px; }
    .money-input { display: flex; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; padding-left: 12px; }
    .money-input:focus-within { border-color: var(--brand); }
    .money-input span { font-weight: 700; color: var(--muted); }
    .money-input input { border: 0 !important; font-weight: 700; font-size: 1.15rem !important; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .span2 { grid-column: 1 / -1; }
    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
    .fs { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0; }
    .fs legend { font-weight: 700; padding: 0 6px; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
    .check, .radio { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; background: var(--bg); cursor: pointer; }
    .radio { background: none; padding: 6px 0; }
    .check input, .radio input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--brand); flex: none; }
    .check small { color: var(--muted); }
    .check.inactive { opacity: .6; }
    .mini-actions { margin-top: 8px; font-size: .88rem; color: var(--muted); }
    .link { background: none; border: 0; padding: 0; color: var(--brand); font-weight: 600; }
    .field-hint { color: var(--muted); font-size: .85rem; }
    .form-error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin: 0; font-weight: 600; }

    .img-picker { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
    .img-preview { width: 180px; aspect-ratio: 16 / 11; border-radius: 12px; overflow: hidden; background: var(--ice-soft); display: grid; place-items: center; color: var(--muted); font-size: .85rem; flex: none; }
    .img-preview img { width: 100%; height: 100%; object-fit: cover; }
    .img-actions { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .file-btn { cursor: pointer; }

    /* ---------- Costeo ---------- */
    .grow { flex: 1; margin: 0; }
    .cost-tag { display: inline-block; margin-left: 6px; padding: 2px 8px; border-radius: 999px; background: var(--ok-soft); color: #0e7d45; font-size: .74rem; font-weight: 700; vertical-align: middle; }
    .cost-tag.none { background: var(--soft, #eef0f5); color: var(--muted); }
    .cost-tag.bad { background: var(--danger-soft); color: var(--danger); }
    .muted-inline { color: var(--muted); font-weight: 500; font-size: .8rem; }
    .o-cost { font-size: .85rem; color: var(--muted); margin: -2px 0 10px; }

    .costing-fs { background: #fbfcff; }
    .cost-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
    @media (max-width: 900px) { .cost-layout { grid-template-columns: 1fr; } }
    .cost-h { margin: 16px 0 8px; font-size: .95rem; }
    .cost-h:first-child { margin-top: 4px; }
    .cost-h small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: .8rem; }
    .opt-row { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; }
    .opt-col { display: flex; flex-direction: column; }
    .small-input { width: 110px !important; min-height: 40px !important; }
    .inline-field { flex-direction: row; align-items: center; gap: 10px; }

    .rc-head, .rc-row { display: grid; grid-template-columns: minmax(150px, 1.6fr) 90px 80px minmax(140px, 1.5fr) 34px; gap: 8px; align-items: center; }
    .rc-head { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 2px 4px; }

    /* ---------- Modal ---------- */

    .cov-step { flex: 1 1 180px; background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; }
    .cov-step span { display: block; color: var(--muted); font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
    .cov-step b { display: block; font-size: 1.35rem; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .cov-step.good { border-left: 5px solid var(--ok); }
    .cov-step.good b { color: #0e7d45; }
    .cov-step.bad { border-left: 5px solid var(--danger); }
    .cov-step.bad b { color: var(--danger); }
    .cov-op { display: grid; place-items: center; font-size: 1.6rem; font-weight: 800; color: var(--muted); padding: 0 2px; }
    @media (max-width: 640px) { .cov-op { display: none; } }

    /* ---------- Inventario ---------- */
    .nav-badge-alert { background: var(--danger); color: #fff; }
    .inv-filters { margin-top: 6px; }
    .inv-kinds { flex-wrap: wrap; margin: 0 0 12px; }
    .inv-kinds button { padding: 8px 13px; font-size: .88rem; }
    .inv-table { min-width: 980px; }
    .inv-table th { white-space: normal; vertical-align: bottom; line-height: 1.25; }
    .inv-table td { vertical-align: top; padding-left: 12px; padding-right: 12px; }
    .inv-hist { min-width: 1000px; }
    .inv-acts { white-space: nowrap; text-align: right; }
    .btn-xs { min-height: 30px; padding: 0 10px; font-size: .8rem; margin-left: 2px; }
    .pc-line .money-input input:focus, .inl-money input:focus { outline: none; }
    .inv-cont td { border-top: 0; }
    .inv-first td { border-top: 1.5px solid var(--line); }
    .row-warn { background: #fffaf0; }
    .st-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: .74rem; font-weight: 800; white-space: nowrap; }
    .st-ok { background: var(--ok-soft); color: #0e7d45; }
    .st-bajo { background: var(--warn-soft); color: #9a5300; }
    .st-agotado { background: var(--danger-soft); color: var(--danger); }
    .st-none { background: #eceef4; color: var(--muted); }
    .inv-alert { background: var(--warn-soft); border-left: 5px solid var(--warn); border-radius: 12px; padding: 10px 14px; margin: 4px 0 12px; font-size: .9rem; line-height: 1.6; }
    .inv-alert small { color: var(--muted); }
    .mv-tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: .74rem; font-weight: 700; white-space: nowrap; background: #eceef4; color: var(--muted); }
    .mv-compra { background: var(--ice-soft); color: #08758b; }
    .mv-entrada { background: var(--ok-soft); color: #0e7d45; }
    .mv-salida { background: var(--warn-soft); color: #9a5300; }
    .mv-venta { background: var(--brand-soft); color: var(--brand-dark); }
    .mv-devolucion { background: #efe9ff; color: #5b3fc4; }
    .mv-ajuste { background: #fff6cc; color: #7a5b00; }
    .seg.seg3 { grid-template-columns: repeat(3, 1fr); }
    .seg.seg3 button { padding: 10px 6px; font-size: .88rem; }
    @media (max-width: 480px) { .seg.seg3 { grid-template-columns: 1fr; } }
    .art-name { font-size: 1.1rem; }
    .art-fs { margin-top: 14px; }
    .art-grid { margin-top: 12px; }
    .art-u { font-weight: 600; text-transform: none; }

    /* Nueva compra */
    .pc-head, .pc-line { display: grid; grid-template-columns: minmax(170px, 2fr) 90px 92px minmax(120px, 1fr) minmax(120px, 1fr) 34px; gap: 8px; align-items: center; }
    .pc-head { font-size: .72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 0 2px 4px; }
    .pc-line { padding: 8px 0; border-top: 1px solid var(--line); }
    .pc-line select, .pc-line > input { width: 100%; min-height: 42px; padding: 6px 8px; border-radius: 8px; border: 1.5px solid var(--line); background: #fff; font-size: .92rem; }
    .pc-line select:focus, .pc-line > input:focus { outline: none; border-color: var(--brand); }
    .pc-line .money-input { padding-left: 8px; border-radius: 8px; }
    .pc-line .money-input input { min-height: 40px; width: 100%; font-size: 1rem !important; padding: 4px 6px; }
    .pc-hint { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); }
    .pc-hint:empty { display: none; }
    .pc-total { margin: 12px 0; }
    .pc-total strong { font-size: 1.6rem; }
    .pc-foot { margin-top: 4px; }
    @media (max-width: 760px) {
      .pc-head { display: none; }
      .pc-line { grid-template-columns: 1fr 1fr 34px; }
      .pc-line [data-f="key"] { grid-column: 1 / 3; }
      .pc-line [data-f="del"] { grid-column: 3; grid-row: 1; }
      /* precio unitario y total en su propia fila */
      .pc-line > .money-input:nth-child(4) { grid-column: 1; }
      .pc-line > .money-input:nth-child(5) { grid-column: 2; }
    }

    /* Alerta flotante de stock mínimo */
    .stock-alert {
      position: fixed; bottom: 24px; right: 24px; z-index: 900; width: min(360px, calc(100vw - 32px));
      background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); border-top: 5px solid var(--danger);
      padding: 12px 14px 14px; animation: sa-in .25s ease;
    }
    @media (max-width: 860px) { .stock-alert { bottom: auto; top: 12px; right: 16px; } }
    @keyframes sa-in { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
    .stock-alert .sa-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .stock-alert ul { list-style: none; margin: 0 0 10px; padding: 0; max-height: 40vh; overflow-y: auto; }
    .stock-alert li { padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: .92rem; }
    .stock-alert li small { display: block; color: var(--muted); }
  </style>
</head>

      <section class="view" id="view-acompanantes" hidden></section>
