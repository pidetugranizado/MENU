<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1b1d29">
  <title>Parqueadero · Vigilante</title>
  <link rel="stylesheet" href="css/common.css?v=2">
  <style>
    /* Módulo del vigilante: registra entradas y salidas.
       NO recibe dinero, NO cambia tarifas, NO borra pagos, NO ve el recaudo. */
    .pk-bar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 12px; padding: 12px 18px;
      background: #1b1d29; color: #fff;
    }
    .pk-bar h1 { margin: 0; flex: 1; font-size: 1.15rem; font-weight: 800; }
    .pk-bar h1 small { display: block; font-weight: 500; font-size: .78rem; opacity: .6; }
    .pk-rate-tag { padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: .85rem; font-weight: 700; white-space: nowrap; }
    .pk-main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 860px) { .pk-main { grid-template-columns: 1fr; } }
    .full { grid-column: 1 / -1; }
    .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; }
    .panel h2 { margin: 0 0 12px; font-size: 1.15rem; display: flex; align-items: center; gap: 8px; }
    .panel h2 small { margin-left: auto; color: var(--muted); font-weight: 600; font-size: .85rem; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .field > span { font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .04em; }
    .field input {
      width: 100%; min-height: 52px; padding: 10px 14px; border-radius: 12px;
      border: 2px solid var(--line); background: #fff; font-size: 1.1rem; font-weight: 600;
    }
    .field input:focus { outline: none; border-color: var(--brand); }
    .plate-input { text-transform: uppercase; letter-spacing: .14em; font-family: ui-monospace, Consolas, monospace; font-size: 1.5rem !important; font-weight: 800 !important; }
    .form-error { background: var(--danger-soft); color: var(--danger); border-radius: 10px; padding: 10px 12px; margin: 0 0 12px; font-weight: 600; }
    .hint { color: var(--muted); font-size: .85rem; margin: 10px 2px 0; }

    .plate {
      display: inline-block; padding: 3px 10px; border-radius: 6px; border: 2px solid #1b1d29;
      background: #ffd400; color: #1b1d29; font-weight: 800; letter-spacing: .08em; font-family: ui-monospace, Consolas, monospace;
    }
    .plate.big { font-size: 1.6rem; padding: 4px 14px; }
    .st { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: .76rem; font-weight: 800; white-space: nowrap; }
    .st.pend { background: var(--danger-soft); color: var(--danger); }
    .st.ok { background: var(--ok-soft); color: #0e7d45; }

    /* Resultado de salida */
    .exit-card { margin-top: 4px; border-radius: 16px; padding: 16px; border: 3px solid; }
    .exit-card.ok { border-color: var(--ok); background: var(--ok-soft); }
    .exit-card.pend { border-color: var(--danger); background: var(--danger-soft); }
    .exit-card.none { border-color: var(--line); background: var(--bg); color: var(--muted); font-weight: 600; }
    .exit-status { font-size: 1.5rem; font-weight: 900; margin: 10px 0 4px; }
    .exit-card.ok .exit-status { color: #0e7d45; }
    .exit-card.pend .exit-status { color: var(--danger); }
    .exit-msg { font-weight: 700; margin: 0 0 10px; }
    .exit-row { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: .95rem; }
    .exit-row span { color: var(--muted); font-weight: 600; }
    .exit-card .btn { margin-top: 12px; }
    .exit-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .exit-pick button { border: 0; background: none; padding: 0; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; min-width: 560px; }
    th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line); }
    td { padding: 10px 12px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f7f8fc; }
    tr:last-child td { border-bottom: 0; }
    .name { text-transform: uppercase; font-weight: 600; }
    .empty { padding: 30px 10px; text-align: center; color: var(--muted); }
    .pk-user { display: flex; align-items: center; gap: 10px; font-size: .85rem; opacity: .9; }
    .pk-user button { background: rgba(255,255,255,.12); color: inherit; border: 0; border-radius: 8px; padding: 6px 10px; font-weight: 600; }
  </style>
</head>
<body>
  <header class="pk-bar">
    <h1>🚗 Parqueadero<small>Módulo del vigilante · entradas y salidas</small></h1>
    <span class="pk-rate-tag" id="rateTag">Tarifa: …</span>
    <span class="pk-user"><span id="whoTag"></span><button type="button" id="logoutBtn" hidden>Cerrar sesión</button></span>
  </header>

  <main class="pk-main">
    <section class="panel">
      <h2>🅿️ Entrada de vehículo</h2>
      <form id="entryForm" novalidate autocomplete="off">
        <label class="field"><span>PLACA</span>
          <input id="plateIn" class="plate-input" maxlength="10" placeholder="ABC123" autocapitalize="characters" spellcheck="false"></label>
        <label class="field"><span>NOMBRE DEL CLIENTE</span>
          <input id="nameIn" maxlength="30" placeholder="Nombre" autocapitalize="words"></label>
        <p class="form-error" id="entryError" hidden></p>
        <button class="btn btn-lg btn-block" type="submit" id="entryBtn">REGISTRAR ENTRADA</button>
        <p class="hint">Se guarda la fecha y hora de entrada y el valor fijo del parqueadero. El cliente paga en caja.</p>
      </form>
    </section>

    <section class="panel">
      <h2>🚦 Salida</h2>
      <label class="field"><span>BUSCAR PLACA</span>
        <input id="exitIn" class="plate-input" maxlength="10" placeholder="ABC123" autocapitalize="characters" spellcheck="false" autocomplete="off"></label>
      <div id="exitResult"></div>
    </section>

    <section class="panel full">
      <h2>📋 Vehículos registrados (dentro) <small id="countTag"></small></h2>
      <div id="activeList"><div class="loading-screen"><div class="spinner dark"></div></div></div>
    </section>
  </main>

  <script src="js/config.js?v=2"></script>
  <script src="js/vendor/pocketbase.umd.js"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/core.js?v=2"></script>
  <script src="js/auth.js?v=2"></script>
  <script src="js/parqueadero.js?v=2"></script>
</body>
</html>
